# Docker Compose config für die Autodata-Pipeline
services:
  autodata-pipeline:
    build: .
    container_name: autodata_pipeline_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    # restart: unless-stopped wenn Sie möchten, dass der Container automatisch neu startet, wenn er abstürzt oder der Host neu gestartet wird.
    restart: unless-stopped