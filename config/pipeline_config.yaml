# config/pipeline_config.yaml macht es möglich, die Pipeline flexibel zu konfigurieren.
project:
  name: "AutoData-Pipeline"
  version: "0.1.0"

# paths definiert die Verzeichnisse für Roh- und verarbeitete Daten.
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"

# processing regelt die Datenverarbeitungsschritte, einschließlich Anonymisierung und Umgang mit fehlenden Werten.
processing:
  anonymize_columns:
    - "email"
    - "name"
    - "telefon"
  date_format: "%Y-%m-%d"
  missing_value_strategy: "drop" # Optionen: drop, fill_zero